name: RGS-QLG Quaternion Bridge — Full Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rgs-qlg-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quaternion-su2-so3-audit:
    name: Quaternion / SU2 / SO3 / QLG tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install numpy pytest scipy

      - name: Verify Python version and dependencies
        run: |
          python --version
          python -c "import numpy, pytest, scipy; print('NumPy:', numpy.__version__); print('pytest:', pytest.__version__); print('SciPy:', scipy.__version__)"

      - name: Compile all Python modules
        run: |
          python -m compileall -q src tests examples scripts

      - name: Run quaternion algebra tests
        run: |
          python -m pytest tests/test_quaternion_algebra.py -v

      - name: Run SU2-SO3 tests
        run: |
          python -m pytest tests/test_su2_so3.py -v

      - name: Run QLG holonomy tests
        run: |
          python -m pytest tests/test_holonomies.py -v

      - name: Run complete test suite
        run: |
          python -m pytest tests/ -v

      - name: Run lattice holonomy demonstration
        run: |
          python examples/lattice_rotation_demo.py

      - name: Run Wilson fermion audit
        run: |
          PYTHONPATH=. python examples/wilson_fermion_audit.py

      - name: Run refinement / overlap / Dirac-Kahler audit
        run: |
          PYTHONPATH=. python examples/wilson_refinement_audit.py

      - name: Run flat-torus G0-G5 and P1 Mosco recovery audits
        run: |
          PYTHONPATH=. python examples/flat_torus_refinement_audit.py
          PYTHONPATH=. python -m pytest tests/test_flat_torus_refinement.py tests/test_flat_torus_embedding.py tests/test_flat_torus_stability.py tests/test_flat_torus_mosco_p1.py -v

      - name: Run curved RGS Ellis refinement audit
        run: |
          PYTHONPATH=. python examples/rgs_ellis_curved_refinement_audit.py
          PYTHONPATH=. python -m pytest tests/test_rgs_ellis_refinement.py -v

      - name: Mobius boundary thermodynamics audit
        run: |
          PYTHONPATH=. python examples/mobius_hawking_thermodynamics.py
          PYTHONPATH=. python -m pytest tests/test_thermodynamics.py -v

      - name: Run integrated Möbius / Q6 / 2I / Clifford / RGS-PSU audit
        run: |
          PYTHONPATH=. python scripts/rgs_psu_integrated_audit.py
          PYTHONPATH=. python -m pytest tests/test_integrated_mobius_psu_audit.py tests/test_mobius_complex.py tests/test_mobius_gauge_audit.py tests/test_mobius_representations.py tests/test_binary_icosahedral.py tests/test_representations_2i.py tests/test_clifford_qlg.py tests/test_q6_complex.py tests/test_discrete_cartan_geometry.py -v

      - name: Upload reproducible integrated audit and Q6 incidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: rgs-psu-integrated-audit-${{ github.sha }}
          path: |
            results/json/rgs_psu_integrated_geometric_gauge_audit.json
            results/artifacts/Q6_canonical_incidence_v1.npz
            results/artifacts/Q6_canonical_incidence_v1.manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Final audit summary
        if: success()
        run: |
          echo "=============================================="
          echo "RGS-QLG QUATERNION BRIDGE"
          echo "=============================================="
          echo "Python compilation: PASS"
          echo "Quaternion algebra: PASS"
          echo "SU(2)-SO(3): PASS"
          echo "QLG holonomies: PASS"
          echo "Complete test suite: PASS"
          echo "Lattice demonstration: PASS"
          echo "Wilson fermion audit: PASS"
          echo "Refinement / overlap / Dirac-Kahler audit: PASS"
          echo "Mobius boundary thermodynamics: PASS"
          echo "=============================================="
